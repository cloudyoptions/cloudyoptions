name: Market Snapshot Job

on:
  schedule:
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-snapshot-update
  cancel-in-progress: false

jobs:
  run-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run snapshot across watchlist & persist state
        env:
          OUT_DIR: "docs"
          STATE_FILE: "docs/data/state.json"
          SNAPSHOTS_FILE: "docs/data/snapshots.json"
        run: |
          python snapshot_worker.py

      - name: Commit & push updated dashboard + snapshot data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No dashboard changes to commit."
          else
            git commit -m "chore: update 50-ticker market snapshot ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
